[package]
name = "gram"
version = "0.1.0"
edition = "2021"
description = "Experimental natural-language-to-probabilistic-logic compiler and reasoning runtime"
license = "MIT"
repository = "https://github.com/gregorycoppola/gram"
readme = "README.md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "gram"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
reqwest = { version = "0.13.4", features = ["json"] }

[dev-dependencies]
glob = "0.3"
